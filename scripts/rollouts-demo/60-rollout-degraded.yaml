# Degraded via a failing analysis: the controller aborts, so status.abort is
# true and Retry becomes the live verb while Promote is blocked.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: canary-degraded
  namespace: demo-rollouts
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: canary-degraded
  template:
    metadata:
      labels:
        app: canary-degraded
    spec:
      containers:
        - name: rollouts-demo
          image: argoproj/rollouts-demo:blue
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: success-rate-fail
